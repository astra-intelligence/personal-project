# Git hooks, installed by the `prepare` script on `pnpm install`.
pre-commit:
  piped: true
  jobs:
    - name: lint
      glob: '*.{ts,tsx,astro}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    - name: format
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commit message
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: branch name
      run: scripts/check-branch-name.sh "$(git rev-parse --abbrev-ref HEAD)"
    - name: check
      run: pnpm check
