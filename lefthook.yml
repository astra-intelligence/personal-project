# Git hooks, installed by the `prepare` script on `pnpm install`.
pre-commit:
  piped: true
  jobs:
    - name: lint
      glob: '*.{ts,tsx,astro}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    - name: format
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commit message
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: branch name
      run: |
        branch="$(git rev-parse --abbrev-ref HEAD)"
        pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'
        if ! printf '%s' "$branch" | grep -Eq "$pattern"; then
          echo "Branch '$branch' must match <type>/<issue>-<short-description>, e.g. feat/12-hero-section"
          exit 1
        fi
    - name: check
      run: pnpm check
