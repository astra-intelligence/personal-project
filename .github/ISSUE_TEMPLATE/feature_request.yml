name: Feature request
description: Propose a new feature or an improvement to an existing one.
labels: [feature]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should this achieve, and for whom?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The conditions that must hold for this to be done.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
